<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Open Graph card de Ancestral Seed — 1200×630 para WhatsApp / X /
    Facebook / LinkedIn.

    Diseño:
    - Fondo navy-500 (#001c38) con pattern aztec sutil
    - Halo dorado a la derecha que ancla la atención
    - Wordmark grande "ANCESTRAL SEED" + tagline "CERTIFICACIÓN DIGITAL"
    - Headline conversacional principal
    - Chip dorado con propuesta de valor concreta
    - Decoraciones de marca (chevron pattern, dot dorado)
  -->

  <defs>
    <!-- Pattern aztec sutil sobre el navy -->
    <pattern id="aztec" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <g stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.08">
        <path d="M0 40 L40 0 L80 40 L40 80 Z"/>
        <path d="M20 40 L40 20 L60 40 L40 60 Z"/>
      </g>
    </pattern>

    <!-- Glow dorado decorativo a la derecha -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente sutil del background principal -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001c38"/>
      <stop offset="100%" stop-color="#062B4D"/>
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Pattern overlay -->
  <rect width="1200" height="630" fill="url(#aztec)"/>

  <!-- Halo dorado en la esquina superior derecha -->
  <ellipse cx="980" cy="180" rx="380" ry="380" fill="url(#glow)"/>

  <!-- Banda inferior dorada para anclaje visual -->
  <rect x="0" y="610" width="1200" height="20" fill="#D4AF37"/>

  <!-- Wordmark — top-left -->
  <g transform="translate(80, 80)">
    <!-- Icono "semilla" simplificado -->
    <g transform="translate(0, 0)">
      <circle cx="32" cy="32" r="32" fill="#D4AF37"/>
      <path d="M32 12 C 22 22, 22 42, 32 52 C 42 42, 42 22, 32 12 Z" fill="#001c38"/>
      <circle cx="32" cy="32" r="3" fill="#D4AF37"/>
    </g>

    <!-- Texto wordmark -->
    <text x="80" y="32" font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="800"
          font-size="28" letter-spacing="5" fill="#FFFFFF">ANCESTRAL SEED</text>
    <text x="80" y="58" font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="600"
          font-size="13" letter-spacing="7" fill="#D4AF37">CERTIFICACIÓN DIGITAL</text>
  </g>

  <!-- Chip "Verificado en blockchain" — top right -->
  <g transform="translate(870, 90)">
    <rect x="0" y="0" width="250" height="42" rx="21" fill="#D4AF37"/>
    <circle cx="22" cy="21" r="6" fill="#001c38"/>
    <text x="38" y="27" font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="700"
          font-size="13" letter-spacing="2" fill="#001c38">VERIFICADO EN BLOCKCHAIN</text>
  </g>

  <!-- Headline principal — izquierda -->
  <g transform="translate(80, 240)">
    <text font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="800"
          font-size="56" fill="#FFFFFF">
      <tspan x="0" y="0">Saberes ancestrales,</tspan>
      <tspan x="0" y="72" fill="#D4AF37">certificados con</tspan>
      <tspan x="0" y="144" fill="#D4AF37">tecnología.</tspan>
    </text>
  </g>

  <!--
    Fix V2-PUB-04 (auditoría v2): antes la card OG era 100% tipografía
    + halo dorado. Faltaba algo visual concreto que mostrara EL PRODUCTO
    de la plataforma. Agregamos un mockup de tarjeta de certificado
    flotando a la derecha: sello dorado con check + nombre de producto
    + hash blockchain + estado "VIGENTE". Es SVG-only así que sigue
    siendo liviano (~5KB extra) y se renderiza idéntico en todos los
    crawlers de WhatsApp/X/LinkedIn.
  -->
  <g transform="translate(720, 230) rotate(-3)">
    <!-- Sombra debajo del mockup -->
    <rect x="6" y="8" width="380" height="220" rx="20" fill="#000000" opacity="0.25"/>

    <!-- Body de la tarjeta -->
    <rect x="0" y="0" width="380" height="220" rx="20" fill="#FFFFFF"/>

    <!-- Header con eyebrow + badge VIGENTE -->
    <text x="24" y="34" font-family="Montserrat, Helvetica, Arial, sans-serif"
          font-weight="700" font-size="10" letter-spacing="3" fill="#7A6418">CERTIFICADO ANCESTRAL SEED</text>
    <rect x="280" y="20" width="78" height="20" rx="10" fill="#3B7B5C"/>
    <text x="319" y="34" font-family="Montserrat, Helvetica, Arial, sans-serif"
          font-weight="700" font-size="10" letter-spacing="2" text-anchor="middle" fill="#FFFFFF">VIGENTE</text>

    <!--
      Fix V3-PUB-15 + V3-PUB-16 (auditoría v3): antes el mockup tenía
      datos hardcoded del demo ("Filigrana ancestral", "Camila Montes
      · Sierra Nevada"). Cuando este link circulara por WhatsApp /
      LinkedIn como preview, daba la impresión engañosa de que ese
      certificado específico era la propuesta institucional. Ahora
      usamos labels genéricos representativos de la categoría 1 del
      Reglamento sin atribuir a una persona real.
    -->
    <text x="24" y="74" font-family="Montserrat, Helvetica, Arial, sans-serif"
          font-weight="800" font-size="22" fill="#001c38">Saber ancestral certificado</text>
    <text x="24" y="98" font-family="Montserrat, Helvetica, Arial, sans-serif"
          font-weight="500" font-size="13" fill="#5C6878">Auditoría cultural + Reglamento de Marca</text>

    <!-- Hash blockchain — placeholder reconocible como ejemplo -->
    <text x="24" y="138" font-family="Montserrat, Helvetica, Arial, sans-serif"
          font-weight="700" font-size="9" letter-spacing="2" fill="#7A6418">HASH BLOCKCHAIN</text>
    <text x="24" y="156" font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-weight="600" font-size="12" fill="#001c38">0xAS-CERT-XXXXXXXXXX…</text>

    <!-- Sello con check (right side) -->
    <g transform="translate(290, 130)">
      <circle cx="38" cy="38" r="38" fill="#D4AF37"/>
      <circle cx="38" cy="38" r="32" fill="none" stroke="#001c38" stroke-width="2"/>
      <path d="M22 38 L34 50 L54 28" stroke="#001c38" stroke-width="4" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Footer separator + leyenda -->
    <line x1="24" y1="186" x2="356" y2="186" stroke="#E7E5DE" stroke-width="1"/>
    <text x="24" y="206" font-family="Montserrat, Helvetica, Arial, sans-serif"
          font-weight="500" font-size="11" fill="#5C6878">Auditoría cultural firmada · Categoría 1</text>
  </g>

  <!-- Tagline / propuesta de valor — bottom-left -->
  <g transform="translate(80, 510)">
    <text font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="500"
          font-size="22" fill="#FFFFFF" opacity="0.85">
      Auditoría cultural + blockchain inmutable
    </text>
    <text font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="700"
          font-size="18" fill="#D4AF37" y="34" letter-spacing="2">
      ancestralseed.com
    </text>
  </g>

  <!-- 3 categorías oficiales del Reglamento — bottom-right -->
  <g transform="translate(870, 480)" font-family="Montserrat, Helvetica, Arial, sans-serif">
    <text font-weight="700" font-size="10" letter-spacing="3" fill="#D4AF37" y="0">3 CATEGORÍAS OFICIALES</text>

    <g transform="translate(0, 20)">
      <circle cx="6" cy="6" r="4" fill="#D4AF37"/>
      <text x="18" y="10" font-weight="600" font-size="13" fill="#FFFFFF">Ancestral Auténtico</text>
    </g>
    <g transform="translate(0, 42)">
      <circle cx="6" cy="6" r="4" fill="#D4AF37" opacity="0.65"/>
      <text x="18" y="10" font-weight="600" font-size="13" fill="#FFFFFF">Tradicional con raíces</text>
    </g>
    <g transform="translate(0, 64)">
      <circle cx="6" cy="6" r="4" fill="#D4AF37" opacity="0.35"/>
      <text x="18" y="10" font-weight="600" font-size="13" fill="#FFFFFF">Inspiración cultural</text>
    </g>
  </g>
</svg>
