<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Open Graph card de Ancestral Seed — 1200×630 para WhatsApp / X /
    Facebook / LinkedIn.

    Rediseño 2026-06 (optimizado para el thumbnail chico de WhatsApp):
    - Menos micro-texto: en el chat la imagen se ve a ~330px de ancho,
      así que todo lo que no se lea a ese tamaño es ruido. Fuera la
      tarjeta-mockup con hash y la lista de categorías.
    - Tres anclas legibles en chico: wordmark, headline 60px, sello
      dorado grande con check.
    - Dominio en pill dorada (alto contraste) abajo a la izquierda.
  -->

  <defs>
    <!-- Pattern aztec sutil sobre el navy -->
    <pattern id="aztec" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <g stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.08">
        <path d="M0 40 L40 0 L80 40 L40 80 Z"/>
        <path d="M20 40 L40 20 L60 40 L40 60 Z"/>
      </g>
    </pattern>

    <!-- Glow dorado detrás del sello -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente sutil del background principal -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001c38"/>
      <stop offset="100%" stop-color="#062B4D"/>
    </linearGradient>

    <!-- Gradiente del sello para darle volumen -->
    <linearGradient id="seal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C654"/>
      <stop offset="100%" stop-color="#C7A800"/>
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Pattern overlay -->
  <rect width="1200" height="630" fill="url(#aztec)"/>

  <!-- Banda inferior dorada para anclaje visual -->
  <rect x="0" y="610" width="1200" height="20" fill="#D4AF37"/>

  <!-- Wordmark — top-left -->
  <g transform="translate(80, 72)">
    <!-- Icono "semilla" simplificado -->
    <g>
      <circle cx="34" cy="34" r="34" fill="#D4AF37"/>
      <path d="M34 13 C 23 24, 23 45, 34 56 C 45 45, 45 24, 34 13 Z" fill="#001c38"/>
      <circle cx="34" cy="34" r="3.5" fill="#D4AF37"/>
    </g>

    <!-- Texto wordmark -->
    <text x="88" y="34" font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="800"
          font-size="31" letter-spacing="5" fill="#FFFFFF">ANCESTRAL SEED</text>
    <text x="88" y="62" font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="600"
          font-size="14" letter-spacing="7" fill="#D4AF37">CERTIFICACIÓN DIGITAL</text>
  </g>

  <!-- Headline principal — izquierda, 60px legible en thumbnail -->
  <g transform="translate(80, 282)">
    <text font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="800"
          font-size="60" fill="#FFFFFF">
      <tspan x="0" y="0">Saberes ancestrales,</tspan>
      <tspan x="0" y="78" fill="#D4AF37">certificados con</tspan>
      <tspan x="0" y="156" fill="#D4AF37">tecnología.</tspan>
    </text>
  </g>

  <!-- Sello dorado grande — derecha. Ancla visual única que se lee
       perfecto incluso a 330px de ancho total. -->
  <g>
    <ellipse cx="960" cy="320" rx="320" ry="320" fill="url(#glow)"/>

    <!-- Cuerpo del sello -->
    <circle cx="960" cy="320" r="148" fill="url(#seal)"/>
    <!-- Doble anillo interior -->
    <circle cx="960" cy="320" r="126" fill="none" stroke="#001c38" stroke-width="3"/>
    <circle cx="960" cy="320" r="116" fill="none" stroke="#001c38" stroke-width="1.5" opacity="0.5"/>

    <!-- Check grande -->
    <path d="M895 320 L945 372 L1030 268" stroke="#001c38" stroke-width="18" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Puntos cardinales decorativos del sello -->
    <circle cx="960" cy="186" r="5" fill="#001c38"/>
    <circle cx="960" cy="454" r="5" fill="#001c38"/>
    <circle cx="826" cy="320" r="5" fill="#001c38"/>
    <circle cx="1094" cy="320" r="5" fill="#001c38"/>
  </g>

  <!-- Chip "VERIFICADO EN BLOCKCHAIN" centrado bajo el sello -->
  <g transform="translate(810, 506)">
    <rect x="0" y="0" width="300" height="46" rx="23" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="26" cy="23" r="6" fill="#D4AF37"/>
    <text x="44" y="29" font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="700"
          font-size="14" letter-spacing="2" fill="#D4AF37">VERIFICADO EN BLOCKCHAIN</text>
  </g>

  <!-- Tagline + dominio — bottom-left -->
  <g transform="translate(80, 500)">
    <text font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="500"
          font-size="23" fill="#FFFFFF" opacity="0.88">
      Auditoría cultural + blockchain inmutable
    </text>
    <!-- Pill dorada con el dominio: el elemento más accionable del banner -->
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="304" height="48" rx="24" fill="#D4AF37"/>
      <text x="152" y="31" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif"
            font-weight="800" font-size="21" letter-spacing="1" fill="#001c38">ancestralseed.com</text>
    </g>
  </g>
</svg>
