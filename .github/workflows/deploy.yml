# Deploy automático a ancestralseed.com (producción, hosting Ferozo/DonWeb por FTP).
#
# Se dispara en cada push a `main` y también a mano (botón "Run workflow").
# Construye con base `/` (build:domain) y sube `dist/` por FTPS de forma
# ADITIVA: nunca borra archivos del servidor, así el WordPress que convive
# en el mismo docroot queda intacto (no toca wp-admin, wp-content ni el
# .htaccess que ya está en prod).
#
# 🔐 Las credenciales NO están en el repo (es público). Se cargan como
# secrets en GitHub: Settings → Secrets and variables → Actions.
#   - FTP_HOST  (ej. ancestralseed.com  o  vps-2977244-x.dattaweb.com)
#   - FTP_USER  (ej. deploy@ancestralseed.com)
#   - FTP_PASS  (la contraseña de esa cuenta FTP)
#   - FTP_DIR   (opcional; docroot remoto. Default "./" = donde cae el login)
name: Deploy a ancestralseed.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy a la vez; si llega otro push, cancela el anterior en curso.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + FTP a producción
    runs-on: ubuntu-latest
    steps:
      - name: ¿Secrets FTP configurados?
        id: gate
        run: |
          if [ -n "${{ secrets.FTP_HOST }}" ] && [ -n "${{ secrets.FTP_USER }}" ] && [ -n "${{ secrets.FTP_PASS }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets FTP no configurados — se saltea el deploy. Cargá FTP_HOST, FTP_USER y FTP_PASS en Settings → Secrets and variables → Actions."
          fi

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node 22
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Build (dominio · base=/ · canonical ancestralseed.com)
        if: steps.gate.outputs.ready == 'true'
        run: npm run build:domain

      - name: Deploy por FTPS a producción (aditivo, no borra WordPress)
        if: steps.gate.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          # FTPS explícito (AUTH TLS) sobre el puerto 21. security: loose
          # tolera certificados self-signed / con mismatch del hosting.
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          # server-dir DEBE terminar en "/". Default "./" = donde cae el login
          # (normalmente el docroot del dominio). Si la cuenta FTP cayera en otra
          # carpeta, setear el secret FTP_DIR con la ruta (con "/" al final).
          server-dir: ${{ secrets.FTP_DIR || './' }}
          # SIN dangerous-clean-slate (=false): NO borra archivos preexistentes
          # del servidor. El WordPress que convive en el docroot queda intacto;
          # la acción solo gestiona los archivos que ella misma sube/actualiza.
          dangerous-clean-slate: false
          timeout: 120000
