    <!-- ─── Open Graph (Facebook / WhatsApp / LinkedIn / Telegram) ──
         Importante: SVG NO es soportado por WhatsApp en og:image.
         Usamos PNG 1200×630 generado por scripts/generate-og.mjs.

         og:image debe ser URL ABSOLUTA. El host sale de VITE_SITE_URL
         (.env = gh-pages por default; build:domain la pisa con
         https://ancestralseed.com). Vite reemplaza https://soyalantapia.github.io/ancestral-seed-app
         en este HTML en build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ancestral Seed" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://soyalantapia.github.io/ancestral-seed-app/" />
    <meta property="og:title" content="Ancestral Seed · Certificación digital" />
    <meta
      property="og:description"
      content="Validamos saberes ancestrales con auditoría cultural y blockchain inmutable. Conocé los 18+ certificados emitidos en LATAM."
    />
    <!-- ?v=2 = cache-bust: WhatsApp/Meta cachean el preview por URL;
         al cambiar el banner hay que bumpear la versión. -->
    <meta
      property="og:image"
      content="https://soyalantapia.github.io/ancestral-seed-app/og-image.png?v=2"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo de Ancestral Seed con la frase: Saberes ancestrales, certificados con tecnología."
    />

    <!-- ─── Schema.org JSON-LD (Google / buscadores) ────────────────
         Fix V2-PUB-08 (auditoría v2): faltaba `sameAs` con perfiles
         oficiales. Google los usa para conectar el knowledge panel
         de la organización con sus redes (mejor ranking + signal de
         autenticidad). Cuando haya nuevas cuentas, agregarlas acá. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ancestral Seed",
        "alternateName": "AS · Seed One Global Corp",
        "url": "https://soyalantapia.github.io/ancestral-seed-app/",
        "logo": "https://soyalantapia.github.io/ancestral-seed-app/logo-mark.png",
        "image": "https://soyalantapia.github.io/ancestral-seed-app/og-image.png",
        "description": "Plataforma de certificación digital de productos, servicios y saberes ancestrales mediante auditoría cultural y registro inmutable en blockchain.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Miami Beach",
          "addressRegion": "FL",
          "addressCountry": "US"
        },
        "email": "info@ancestralseed.com",
        "telephone": "+54-9-11-4937-8422",
        "sameAs": [
          "https://twitter.com/ancestralseed",
          "https://x.com/ancestralseed"
        ]
      }
    </script>

    <script>
      // Decode SPA redirect from 404.html
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
